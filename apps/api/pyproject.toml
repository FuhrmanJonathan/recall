[project]
name = "recall-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "openai>=1.99",
    "python-docx>=1.1",
    "python-multipart>=0.0.32",
    "recall-database",
    "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
ocr = [
    "pillow>=10.0",
    "torch>=2.4",
    "transformers>=4.50",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv.sources]
recall-database = { path = "../database", editable = true }