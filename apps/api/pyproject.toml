[project]
name = "recall-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.115,<1.0",
    "numpy>=1.26",
    "google-auth[requests]>=2.40,<3",
    "openai>=1.99",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.32",
    "pwdlib[argon2]>=0.3.1",
    "recall-database",
    "uvicorn>=0.34,<1.0",
    "tzdata>=2026.5",
    "resend>=2.49.1",
    "scikit-learn>=1.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv.sources]
recall-database = { path = "../database", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
